# Regras de negócio do robô de revenda. Edite à vontade: o robô relê este arquivo a cada execução.

# Teto de preço por compra (R$). Anúncios acima disso não viram alerta.
orcamento_max: 3000

# Margem mínima para valer a ida: lucro estimado / preço pago.
margem_min_pct: 20

# Lucro mínimo em reais (evita alertas de R$ 40 de lucro em itens baratos).
lucro_min_reais: 100

# Como estimamos o preço de revenda:
#   venda_estimada = mediana dos anúncios parecidos x (1 - desconto_negociacao_pct/100)
#   lucro = venda_estimada - preço pedido - custo_fixo_reais - taxa_venda_pct% da venda
desconto_negociacao_pct: 7      # quem compra de você também pechincha
custo_fixo_reais: 40            # Uber/ônibus, tempo, película/capinha para revender
taxa_venda_pct: 0               # 0 vendendo direto na OLX/Facebook; ~12-16 no Mercado Livre

# Referência de preço
referencia_dias: 30             # janela de anúncios usada para calcular a mediana
referencia_min_amostras: 5      # menos que isso = referência fraca, não gera alerta
incluir_lojistas_na_referencia: false
alertar_lojistas: false         # anúncios de loja raramente são achados

# Preço abaixo de X% da mediana é suspeito (golpe, peça, bloqueado). Vira alerta com risco alto.
preco_suspeito_pct: 45

# Só considera anúncios publicados nos últimos N dias (os achados somem rápido).
idade_max_dias: 7

# Regiões aceitas. Municípios inteiros e/ou zonas do Rio (ver src/regiao.py).
municipios_aceitos: ["Rio de Janeiro", "Niterói"]
zonas_aceitas: ["Zona Sul", "Zona Norte", "Centro", "Barra/Jacarepaguá", "Zona Oeste", "Niterói"]
# Anúncio sem bairro informado, mas no município aceito: aceitar?
aceitar_bairro_desconhecido: true

# Termos que tiram o anúncio de tudo (referência e alertas). Regex no título minúsculo e sem acento.
# "acessorios": só exclui quando o termo vem ANTES do nome do produto ("Capa iPhone 13" sai;
#               "iPhone 13 com capa" fica).
# "negocio": exclui sempre (não é venda do produto inteiro e funcionando). Ignorado quando vem
#            negado logo antes ("sem defeito", "nunca bloqueado").
excluir_sempre:
  acessorios:
    - "\\bcapas?\\b|\\bcapinhas?\\b|\\bpeliculas?\\b|\\bcases?\\b|\\bcarregador\\b|\\bcabo\\b"
    - "\\bsuporte\\b|\\bpulseiras?\\b|\\bcontroles?\\b|\\bjoy-?cons?\\b|\\bjogos?\\b|\\bmidias?\\b"
    - "\\bbateria\\b|\\btela\\b|\\bdisplay\\b|\\bcarcaca\\b|\\btampa\\b|\\bcooler\\b|\\bbase\\b|\\bdock\\b"
  negocio:
    - "\\bso a caixa\\b|\\bcaixa vazia\\b|\\bsomente a caixa\\b"
    - "\\bcompro\\b|\\bprocuro\\b|\\bpago bem\\b"
    - "\\bso troco\\b|\\bapenas troca\\b|\\bsomente troca\\b"
    - "\\balugo\\b|\\baluguel\\b|\\bloca(cao|-se)\\b"
    - "\\b(para|pra|retirada de|venda de) pecas\\b|\\bsucata\\b|\\bplaca (mae|logica)\\b"
    - "\\bdefeito\\b|\\bdefeituos[oa]\\b|\\bnao liga\\b|\\bqueimad[oa]\\b|\\bmolhad[oa]\\b"
    - "\\bbloquead[oa]\\b|\\bbloqueio\\b|\\bconta vinculada\\b"
    - "\\breplica\\b|\\bxing ling\\b|\\bpirata\\b|\\bdesbloqueado (por|via) software\\b"
    - "\\b(tela|vidro) (quebrad|trincad|rachad|manchad)[oa]\\b|\\btrincad[oa]\\b"
  negacoes: ["sem", "nenhum", "nenhuma", "nunca", "zero", "nao tem", "nao esta", "livre de", "nao e"]

# Fontes
fontes:
  olx:
    # Desligada: a OLX bloqueia programas (HTTP 403), tanto do GitHub quanto do PC.
    # Em vez disso, o painel mostra botões "Buscar na OLX até R$ X" para abrir no navegador.
    ativa: false
    # {q} = termo de busca. sf=1 ordena por mais recentes.
    url_busca: "https://www.olx.com.br/estado-rj/rio-de-janeiro-e-regiao?q={q}&sf=1"
    paginas: 2
    intervalo_seg: 2.5
    max_detalhes_por_execucao: 40   # páginas de anúncio abertas para ler a descrição

# Link das buscas prontas no painel (abre no SEU navegador). {q} = termo, {max} = preço máximo.
busca_manual_olx: "https://www.olx.com.br/estado-rj/rio-de-janeiro-e-regiao?q={q}&pe={max}&sf=1"

# IA (Claude) para triagem dos anúncios. Só analisa os que já passaram na conta de margem.
ia:
  modelo: "claude-haiku-5-5"
  effort: "low"
  max_analises_por_execucao: 40

# Pesquisa na web com o Claude (busca da Anthropic: US$ 0,01 por busca + tokens das páginas lidas).
# Traz o preço NOVO de cada produto em lojas (teto de revenda e "melhores ofertas") e passagens aéreas.
# MODO ECONÔMICO: Haiku 5.5 (~20x mais barato por token que o Sonnet). Se a API recusar a busca
# com o Haiku, o robô passa sozinho para o modelo_reserva.
pesquisa_web:
  ativa: true
  modelo: "claude-haiku-5-5"
  modelo_reserva: "claude-sonnet-5-5"
  effort: "low"
  max_buscas_por_pesquisa: 2
  produtos:
    refazer_a_cada_dias: 14         # preço de novo muda devagar
    max_por_execucao: 2
    max_por_execucao_inicial: 4     # enquanto houver produto nunca pesquisado
  passagens:
    refazer_a_cada_horas: 22        # 1 vez por dia por rota
    max_por_execucao: 2
  # Teto mensal (US$). Se o gasto do mês passar disso, as pesquisas param até o mês virar.
  teto_mensal_usd: 25

# Caçador de promoções: o Claude procura o catálogo em promoção em LOJAS CONFIÁVEIS e o robô
# compara com o preço de revenda (mediana dos usados no Rio). Só aparece o que dá lucro.
promocoes:
  ativa: true
  refazer_a_cada_horas: 12           # 2 vezes por dia
  max_buscas_por_pesquisa: 3
  # Comprar novo e revender: quem compra lacrado aceita pagar perto da mediana dos usados ou mais.
  # Usamos a mediana dos usados como preço de revenda (conservador).
  # Só são aceitos links destes sites (subdomínios incluídos). O resto é descartado no código.
  lojas_confiaveis:
    - amazon.com.br
    - mercadolivre.com.br
    - magazineluiza.com.br
    - kabum.com.br
    - casasbahia.com.br
    - pontofrio.com.br
    - extra.com.br
    - americanas.com.br
    - fastshop.com.br
    - carrefour.com.br
    - girafa.com.br
    - samsung.com
    - apple.com
    - nintendo.com
    - playstation.com
    - xbox.com
    - pichau.com.br
    - terabyteshop.com.br
  # Comunidades de promoção (usadas para ACHAR a oferta; o link final precisa ser de loja confiável).
  sites_de_promocao:
    - pelando.com.br
    - promobit.com.br

# Leilões de carros: o Claude procura lotes nos sites de leiloeiros conhecidos e o robô faz a conta
# completa (lance + comissão + custos + reparo) contra o valor de revenda (FIPE com deságio de leilão).
leiloes:
  # Pesquisa automática DESLIGADA: os sites de leilão só mostram os lotes num navegador de verdade,
  # e duas tentativas (Haiku e Sonnet lendo páginas) voltaram vazias. Use a calculadora da aba Leilões.
  # As regras abaixo (comissão, custos, deságio, margem, lance máximo) continuam valendo para ela.
  ativa: false
  refazer_a_cada_horas: 20           # 1 vez por dia
  # Pesquisa FORTE (os sites de leilão são difíceis de ler): Sonnet 5.5, que também abre as páginas dos
  # lotes. Custo estimado: US$ 0,15 a 0,30 por dia. Para economizar, troque por "claude-haiku-5-5".
  modelo: "claude-sonnet-5-5"
  effort: "medium"
  max_buscas_por_pesquisa: 6
  max_paginas_lidas: 6
  lance_max: 30000                   # maior lance que você toparia dar (R$)
  regiao: "Rio de Janeiro (RJ) e cidades próximas; aceitar também ES, MG e SP (retirada com transporte)"
  comissao_leiloeiro_pct: 5          # padrão de mercado (paga sobre o lance)
  custos_fixos_reais: 2500           # CARRO: pátio, despachante, transferência, laudo cautelar, transporte
  custos_fixos_moto_reais: 1200      # MOTO: mesmos itens, mais baratos
  dias_para_vender: {carro: 30, moto: 20}   # para o retorno ao mês
  # Cenário pessimista (para saber se aguenta um imprevisto): revenda X% menor e reparo Y% maior.
  pessimista: {revenda_menor_pct: 10, reparo_maior_pct: 50}
  margem_min_pct: 15
  # Quanto abaixo da FIPE um carro com histórico de leilão revende (o comprador desconta o "passado").
  desagio_revenda_pct:
    recuperado_financiamento: 12
    sinistro_pequena_monta: 25
    sinistro_media_monta: 35
    outro: 20
  # Grande monta e sucata não voltam a circular: só servem para peças (fora da conta de revenda).
  sites:
    - copart.com.br
    - sodresantoro.com.br
    - freitasleiloeiro.com.br
    - vipleiloes.com.br
    - megaleiloes.com.br
    - superbid.net
    - pestanaleiloes.com.br
    - palaciodosleiloes.com.br
    - mgl.com.br
  # Só para consultar o valor FIPE (o link do lote precisa ser de um leiloeiro da lista acima).
  sites_consulta: ["veiculos.fipe.org.br", "fipe.org.br"]
