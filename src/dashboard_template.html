<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Revenda RJ · oportunidades</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
  --accent: #2a78d6; --accent-soft: #cde2fb; --band: #b7d3f6;
  --good: #0ca30c; --good-ink: #0a7a0a; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #262624; --border: #33332f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
    --accent: #3987e5; --accent-soft: #184f95; --band: #1c5cab; --good-ink: #3fcf3f;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #262624; --border: #33332f;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86;
  --accent: #3987e5; --accent-soft: #184f95; --band: #1c5cab; --good-ink: #3fcf3f;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--accent); }
header { padding: 20px 20px 8px; max-width: 1400px; margin: 0 auto; }
.topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--text-2); font-size: 13px; }
.aviso { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 4px solid var(--warning); font-size: 14px; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ativo { outline: 2px solid var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.tile .rot { font-size: 12px; color: var(--text-2); }
.tile .val { font-size: 22px; font-weight: 600; }
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
nav .in { max-width: 1400px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 6px; overflow-x: auto; }
nav button { white-space: nowrap; border: 0; background: none; color: var(--text-2); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
nav .cont { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface-2); font-size: 12px; margin-left: 4px; }
main { max-width: 1400px; margin: 0 auto; padding: 14px 20px 60px; }
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
.filtros select, .filtros input { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.card.apagado { opacity: .55; }
.foto { position: relative; aspect-ratio: 4 / 3; background: var(--surface-2); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto .sem { font-size: 42px; opacity: .5; }
.foto .selo { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.foto .nav-foto { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 4px; }
.foto .nav-foto button { border: 0; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 8px; cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.foto .pill { background: rgba(255,255,255,.92); color: #0b0b0b; border: 0; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.corpo { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.corpo h3 { font-size: 15px; margin: 0; line-height: 1.3; }
.corpo h3 a { color: var(--text); text-decoration: none; }
.corpo h3 a:hover { text-decoration: underline; }
.precos { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.preco { font-size: 24px; font-weight: 700; }
.riscado { color: var(--text-3); text-decoration: line-through; font-size: 13px; }
.lucro { color: var(--good-ink); font-weight: 700; }
.muted { color: var(--text-2); font-size: 13px; }
.mini { color: var(--text-3); font-size: 12px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.resumo-ia { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--text-2); }
details ul { margin: 6px 0 0; padding-left: 18px; }
.acoes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.faixa svg { display: block; width: 100%; height: 34px; overflow: visible; }
.faixa text { font-size: 10px; fill: var(--text-3); }
.vazio { padding: 40px; text-align: center; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 10px; overflow: hidden; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
h2 { font-size: 17px; margin: 22px 0 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); }
.ofertas a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--text); padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.ofertas a:hover { color: var(--accent); }
.ofertas b { white-space: nowrap; }
.spark svg { display: block; width: 100%; height: auto; overflow: visible; }
.spark text { font-size: 10px; fill: var(--text-3); }
.spark .pt:hover { r: 6; }
.oculto { display: none !important; }
.card.exemplo { border: 2px dashed var(--accent); }
.exemplo-aviso { border-left-color: var(--accent); margin-bottom: 14px; }
.foto .pill.exemplo-pill, .pill.exemplo-pill { background: var(--accent); color: #fff; }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); padding: 4px 8px; border-radius: 6px; font-size: 12px; z-index: 50; }
@media (max-width: 520px) { .grade { grid-template-columns: 1fr; } header, main { padding-left: 12px; padding-right: 12px; } }

/* ===================================================================== visual 2.0
   Caderno de achados do revendedor carioca. Assinatura: a ETIQUETA de preço (amarela, com furinho)
   que carrega o lucro de cada achado. Todo o resto fica quieto. */
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --surface-2: #F3F5F9; --border: #DDE3EC;
  --text: #101828; --text-2: #475467; --text-3: #8A94A6;
  --accent: #1F5EFF; --accent-soft: #DCE6FF; --band: #BFD0FF;
  --tag: #FFC93C; --tag-ink: #3A2A00; --lucro: #0E9F6E; --good-ink: #0B7A55;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --raio: 16px;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, monospace;
  --display: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    --bg: #0D1320; --surface: #151D2E; --surface-2: #1C2639; --border: #26324A;
    --text: #EAF0FA; --text-2: #A9B6CC; --text-3: #6F7D96;
    --accent: #5B8CFF; --accent-soft: #1A2A55; --band: #2B4690; --good-ink: #3DDC97; --lucro: #3DDC97;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 28px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg: #0D1320; --surface: #151D2E; --surface-2: #1C2639; --border: #26324A;
  --text: #EAF0FA; --text-2: #A9B6CC; --text-3: #6F7D96;
  --accent: #5B8CFF; --accent-soft: #1A2A55; --band: #2B4690; --good-ink: #3DDC97; --lucro: #3DDC97;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 28px -16px rgba(0,0,0,.6);
}
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -0.005em; }
h1, h2, h3, .preco, .tile .val { font-family: var(--display); }
h1 { font-weight: 800; letter-spacing: -0.03em; font-size: 24px; }
h2 { font-weight: 800; letter-spacing: -0.02em; font-size: 19px; margin-top: 28px; }
.preco, .tile .val, td.num, .lucro, .num-mono { font-variant-numeric: tabular-nums; }
.preco { font-weight: 800; letter-spacing: -0.02em; }
.card { border-radius: var(--raio); border-color: var(--border); transition: transform .18s ease, box-shadow .18s ease; }
.card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(16,24,40,.06), 0 18px 36px -18px rgba(16,24,40,.35); }
.foto { background: linear-gradient(135deg, var(--surface-2), var(--accent-soft)); }
.tile { border-radius: var(--raio); border: 0; box-shadow: var(--shadow); }
.btn { border-radius: 10px; font-weight: 600; }
.btn.primario { box-shadow: 0 6px 16px -8px var(--accent); text-decoration: none; }
a.btn { text-decoration: none; }
nav { backdrop-filter: saturate(1.4) blur(10px); background: color-mix(in srgb, var(--bg) 82%, transparent); }
nav button { border-radius: 999px; font-weight: 600; }
nav button[aria-selected="true"] { background: var(--text); color: var(--bg); box-shadow: none; }
nav button[aria-selected="true"] .cont { background: var(--tag); color: var(--tag-ink); }
.pill { border-radius: 999px; }
.resumo-ia { border-radius: 12px; border-left: 3px solid var(--accent); }
table { border-radius: var(--raio); box-shadow: var(--shadow); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { .card, .card:hover { transition: none; transform: none; } }

/* Assinatura: etiqueta de preço com furinho e barbante */
.etiqueta { position: relative; display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono);
  font-weight: 800; font-size: 14px; color: var(--tag-ink); background: var(--tag); padding: 6px 12px 6px 22px;
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%); transform: rotate(-2deg);
  -webkit-mask: radial-gradient(circle 4px at 13px 50%, transparent 98%, #000 100%);
          mask: radial-gradient(circle 4px at 13px 50%, transparent 98%, #000 100%); }
.etiqueta small { font-weight: 600; opacity: .75; font-size: 12px; }
.etiqueta.grande { font-size: 22px; padding: 10px 18px 10px 30px; clip-path: polygon(18px 0, 100% 0, 100% 100%, 18px 100%, 0 50%);
  -webkit-mask: radial-gradient(circle 6px at 19px 50%, transparent 98%, #000 100%);
          mask: radial-gradient(circle 6px at 19px 50%, transparent 98%, #000 100%); }
.foto .etiqueta { position: absolute; right: 10px; bottom: 12px; }

/* Topo */
header .marca { display: flex; align-items: baseline; gap: 10px; }
header .marca small { font-family: var(--mono); color: var(--text-3); font-size: 12px; }

/* Aba Hoje */
.hoje { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: stretch; }
.hoje .frase { background: var(--surface); border-radius: 22px; padding: 26px 28px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.hoje .frase h2 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.08; margin: 0 0 14px; letter-spacing: -0.035em; }
.hoje .frase h2 em { font-style: normal; background: linear-gradient(transparent 62%, var(--tag) 62%); }
.hoje .frase p { color: var(--text-2); margin: 0 0 16px; max-width: 46ch; }
.hoje .lado { display: grid; gap: 12px; }
.linha-resumo { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface);
  border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid transparent; }
.linha-resumo:hover { border-color: var(--accent); }
.linha-resumo .rot { font-weight: 700; }
.linha-resumo .det { color: var(--text-2); font-size: 13px; }
.linha-resumo .val { font-family: var(--mono); font-weight: 800; font-size: 18px; }
.mini-lista { display: grid; gap: 8px; margin-top: 4px; }
.mini-item { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; background: var(--surface-2); text-decoration: none; color: var(--text); }
.mini-item img, .mini-item .ico { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--accent-soft); display: grid; place-items: center; font-size: 24px; }
.mini-item .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.mini-item .s { font-size: 12px; color: var(--text-2); }
@media (max-width: 860px) { .hoje { grid-template-columns: 1fr; } }

/* Leilões */
.conta { font-family: var(--mono); font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.conta .tot { border-top: 1px dashed var(--border); padding-top: 4px; font-weight: 800; }
.conta .neg { color: var(--text-2); }
.tipo-lote { font-weight: 700; }
.guia { background: var(--surface); border-radius: var(--raio); box-shadow: var(--shadow); padding: 6px 18px 14px; margin-top: 18px; }
.guia h3 { margin: 16px 0 6px; font-size: 15px; }
.guia p, .guia li { color: var(--text-2); font-size: 14px; }
.lucro.neg { color: var(--critical); }
@media (max-width: 640px) { .tiles { display: none; } header .marca small { display: none; } h1 { font-size: 22px; }
  .mini-item { grid-template-columns: 44px 1fr; } .mini-item img, .mini-item .ico { width: 44px; height: 44px; }
  .mini-item .etiqueta { grid-column: 2; justify-self: start; } .hoje .frase { padding: 20px; } }

.calc-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
.calc-grade label { display: grid; gap: 4px; font-size: 12px; color: var(--text-2); font-weight: 600; }
.calc-grade .largo { grid-column: 1 / -1; }
.calc-res .conta { max-width: 620px; }
.calc-grade input, .calc-grade select { width: 100%; min-width: 0; box-sizing: border-box; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="topo">
    <div class="marca"><h1>Revenda RJ</h1><small>caderno de achados · Rio e Niterói</small></div>
    <span class="sub" id="atualizado"></span>
    <span style="flex:1"></span>
    <button class="btn" id="tema" title="Alternar tema claro/escuro">🌓</button>
  </div>
  <div id="avisos"></div>
  <div class="tiles" id="tiles"></div>
</header>
<nav><div class="in" role="tablist" id="abas"></div></nav>
<main id="conteudo"></main>
<div class="tip oculto" id="tip"></div>

<script>
const DADOS = /*__DADOS__*/null;
const LS = "revenda-rj:v1";
const estado = JSON.parse(localStorage.getItem(LS) || "{}");
estado.status ||= {};
const visitaAnterior = estado.ultimaVisita ? new Date(estado.ultimaVisita) : null;
function salvar() { localStorage.setItem(LS, JSON.stringify(estado)); }
window.addEventListener("beforeunload", () => { estado.ultimaVisita = new Date().toISOString(); salvar(); });

// ---------------------------------------------------------------- utilidades
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlSegura = u => (typeof u === "string" && /^https?:\/\//i.test(u)) ? esc(u) : "#";
const brl = v => v == null ? "—" : (v < 0 ? "−R$ " : "R$ ") + Math.abs(Math.round(v)).toLocaleString("pt-BR");
const pct = v => v == null ? "—" : (v > 0 ? "+" : "") + Math.round(v) + "%";
function ha(iso) {
  if (!iso) return "";
  const min = (Date.now() - new Date(iso)) / 60000;
  if (min < 60) return `há ${Math.max(1, Math.round(min))} min`;
  if (min < 1440) return `há ${Math.round(min / 60)} h`;
  return `há ${Math.round(min / 1440)} d`;
}
function diaMes(s) { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(s || ""); return m ? (m[3] ? `${m[3]}/${m[2]}` : `${m[2]}/${m[1]}`) : s; }
const imgFallback = cat => `onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sem',textContent:'${ICONE[cat] || "📦"}'}))"`;
function linkOlx(busca, max) {
  const modelo = DADOS.regras.busca_manual_olx || "https://www.olx.com.br/estado-rj/rio-de-janeiro-e-regiao?q={q}&pe={max}&sf=1";
  return modelo.replace("{q}", encodeURIComponent(busca).replace(/%20/g, "+")).replace("{max}", Math.round(max));
}
const tetoPorId = () => Object.fromEntries((DADOS.promocoes?.tetos || []).map(t => [t.id, t]));
function blocoBuscasOlx() {
  const tetos = DADOS.promocoes?.tetos || [];
  if (!tetos.length) return `<div class="aviso">🔎 As buscas prontas na OLX aparecem aqui assim que o robô souber quanto vale cada produto (o preço de usado vem da pesquisa web, alguns produtos por execução).</div>`;
  return `<h2>🔎 Buscas prontas na OLX</h2>
    <p class="muted">A OLX não permite robôs, então a busca é sua: cada botão abre a OLX do Rio já com o preço máximo que ainda dá ${DADOS.regras.margem_min_pct}% de lucro. Dica: no app da OLX, salve a busca e ative o <b>alerta</b> para ser avisado de anúncios novos.</p>
    <div class="grade">${tetos.map(t => `<article class="card"><div class="corpo">
      <h3>${ICONE[t.categoria] || "📦"} ${esc(t.nome)}</h3>
      <div class="precos"><span class="preco">até ${brl(t.teto)}</span></div>
      <div class="muted">revende por ~${brl(t.mediana)} (${t.fonte === "web" ? "preço típico de usado na web" : t.n + " anúncios"})</div>
      <div class="acoes"><a class="btn primario" href="${urlSegura(linkOlx(t.busca, t.teto))}" target="_blank" rel="noopener">🔎 Buscar na OLX até ${brl(t.teto)} ↗</a></div>
    </div></article>`).join("")}</div>`;
}
function dataBr(iso) { return iso ? new Date(iso).toLocaleString("pt-BR", {dateStyle: "short", timeStyle: "short"}) : "—"; }
const ICONE = {celular: "📱", console: "🎮", tablet: "📲", relogio: "⌚", notebook: "💻", gpu: "🖥️", drone: "🛸"};
const CAT_NOME = {celular: "Celulares", console: "Consoles", tablet: "Tablets", relogio: "Relógios", notebook: "Notebooks", gpu: "Placas de vídeo", drone: "Drones"};
const RISCO = {baixo: ["Risco baixo", "var(--good)"], medio: ["Risco médio", "var(--warning)"], alto: ["Risco alto", "var(--critical)"]};
const RECOM = {ir_ver: "✅ Vale ir ver", negociar_antes: "💬 Negociar antes", evitar: "⛔ Evitar"};
const ESTADO = {novo_lacrado: "Lacrado", seminovo_otimo: "Seminovo ótimo", bom: "Bom estado", marcas_de_uso: "Marcas de uso", com_problema: "Com problema", nao_informado: "Estado não informado"};
const produtoPorId = Object.fromEntries((DADOS.produtos || []).map(p => [p.id, p]));

const tip = document.getElementById("tip");
document.addEventListener("mouseover", e => {
  const alvo = e.target.closest("[data-tip]");
  if (!alvo) { tip.classList.add("oculto"); return; }
  tip.textContent = alvo.dataset.tip; tip.classList.remove("oculto");
});
document.addEventListener("mousemove", e => { tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; });

// ---------------------------------------------------------------- tema
document.getElementById("tema").onclick = () => {
  const escuro = document.documentElement.dataset.theme

// ---------------------------------------------------------------- gráficos
// Faixa de preço do mercado: trilho do menor ao maior relevante, faixa central p25-p75,
// traço da mediana e ponto do preço do anúncio.
function faixaPreco(ref, atual) {
  if (!ref) return "";
  const menor = ref.menor ?? ref.p25;
  const lo = Math.min(menor, atual ?? menor, ref.p25) * 0.95;
  const hi = Math.max(ref.p75 * 1.1, atual ?? 0, ref.mediana * 1.15);
  const x = v => 6 + (v - lo) / (hi - lo) * 88;  // em %
  const marc = atual != null ? `<circle cx="${x(atual)}%" cy="12" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>Este anúncio: ${brl(atual)}</title></circle>` : "";
  return `<div class="faixa" data-tip="Mercado: metade dos anúncios entre ${brl(ref.p25)} e ${brl(ref.p75)} · mediana ${brl(ref.mediana)} · ${ref.n} anúncios">
  <svg role="img" aria-label="Faixa de preço do mercado entre ${brl(ref.p25)} e ${brl(ref.p75)}, mediana ${brl(ref.mediana)}">
    <rect x="${x(lo)}%" y="10" width="${x(hi) - x(lo)}%" height="4" rx="2" fill="var(--surface-2)"/>
    <rect x="${x(ref.p25)}%" y="8" width="${Math.max(1, x(ref.p75) - x(ref.p25))}%" height="8" rx="4" fill="var(--band)"/>
    <line x1="${x(ref.mediana)}%" x2="${x(ref.mediana)}%" y1="4" y2="20" stroke="var(--text-2)" stroke-width="2"/>
    ${marc}
    <text x="${Math.min(70, Math.max(30, (x(ref.p25) + x(ref.p75)) / 2))}%" y="32" text-anchor="middle">maioria: ${brl(ref.p25)}–${brl(ref.p75)}</text>
  </svg></div>`;
}

// Histórico de preço da passagem: linha de 2px + linha tracejada do preço-alvo.
function sparkline(hist, alvo) {
  if (!hist || hist.length < 2) return `<div class="mini">O histórico aparece a partir da 2ª pesquisa.</div>`;
  const W = 300, H = 60, P = 6;
  const vs = hist.map(h => h.preco).concat(alvo ? [alvo] : []);
  const lo = Math.min(...vs) * 0.95, hi = Math.max(...vs) * 1.05;
  const x = i => P + i / (hist.length - 1) * (W - 2 * P);
  const y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const d = hist.map((h, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(h.preco).toFixed(1)}`).join(" ");
  const pts = hist.map((h, i) => `<circle class="pt" cx="${x(i)}" cy="${y(h.preco)}" r="${i === hist.length - 1 ? 4 : 3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" data-tip="${dataBr(h.t)}: ${brl(h.preco)}"/>`).join("");
  const linhaAlvo = alvo ? `<line x1="${P}" x2="${W - P}" y1="${y(alvo)}" y2="${y(alvo)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W - P}" y="${y(alvo) - 4}" text-anchor="end">alvo ${brl(alvo)}</text>` : "";
  return `<div class="spark"><svg viewBox="0 0 ${W} ${H + 8}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Histórico do menor preço: de ${brl(hist[0].preco)} para ${brl(hist.at(-1).preco)}">
    ${linhaAlvo}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>${pts}</svg></div>`;
}

// ---------------------------------------------------------------- cards de anúncio
function fotoHtml(a, exemplo = false) {
  const imgs = a.imagens || [];
  const novo = !exemplo && visitaAnterior && new Date(a.primeiro_visto) > visitaAnterior;
  const selos = exemplo ? [SELO_EXEMPLO] : [];
  if (a.margem != null) selos.push(`<span class="pill">${a.margem >= DADOS.regras.margem_min_pct ? "🔥" : "👀"} ${pct(a.margem)}</span>`);
  if (novo) selos.push(`<span class="pill">🆕 novo</span>`);
  if (a.situacao === "vendido") selos.push(`<span class="pill">✔️ vendido</span>`);
  const img = imgs.length
    ? `<img src="${urlSegura(imgs[0])}" alt="Foto do anúncio: ${esc(a.titulo)}" loading="lazy" referrerpolicy="no-referrer" ${imgFallback(a.categoria)}>`
    : `<span class="sem">${ICONE[a.categoria] || "📦"}</span>`;
  const nav = imgs.length > 1 ? `<div class="nav-foto"><button data-foto="-1" data-id="${a.id}" aria-label="Foto anterior">‹</button><button data-foto="1" data-id="${a.id}" aria-label="Próxima foto">›</button></div>` : "";
  const tag = a.lucro > 0 && a.situacao !== "descartado" ? `<span class="etiqueta">+${brl(a.lucro)}</span>` : "";
  return `<div class="foto" data-idx="0">${img}<div class="selo">${selos.join("")}</div>${tag}${nav}</div>`;
}

function cardAnuncio(a, exemplo = false) {
  const st = exemplo ? null : estado.status[a.id]?.estado;
  const ia = a.analise;
  const prod = produtoPorId[a.item_id] || EXEMPLO_PRODUTOS.find(p => p.id === a.item_id);
  const linkAnuncio = exemplo ? `href="#" data-exemplo-link` : `href="${urlSegura(a.url)}" target="_blank" rel="noopener"`;
  const badges = [];
  if (ia) {
    const [rot, cor] = RISCO[ia.nivel_risco] || ["?", "var(--text-3)"];
    badges.push(`<span class="pill"><span class="dot" style="background:${cor}"></span>${rot}</span>`);
    badges.push(`<span class="pill">${RECOM[ia.recomendacao] || ""}</span>`);
    if (ia.estado) badges.push(`<span class="pill">${ESTADO[ia.estado] || ia.estado}</span>`);
  } else {
    badges.push(`<span class="pill"><span class="dot" style="background:var(--text-3)"></span>Sem análise da IA</span>`);
  }
  if (a.suspeito) badges.push(`<span class="pill"><span class="dot" style="background:var(--critical)"></span>⚠️ Preço bom demais</span>`);
  if (a.preco_inicial && a.preco < a.preco_inicial) badges.push(`<span class="pill">📉 baixou ${brl(a.preco_inicial - a.preco)}</span>`);
  if (a.lojista) badges.push(`<span class="pill">🏪 loja</span>`);
  if (st) badges.push(`<span class="pill">${{vou_ver: "📍 vou ver", comprei: "🛒 comprei", descartado: "🗑️ descartado", vendi: "💰 vendi"}[st]}</span>`);

  const novoMin = prod?.novo?.ofertas?.length ? Math.min(...prod.novo.ofertas.map(o => o.preco)) : null;
  const linhaNovo = novoMin ? `<div class="mini">🏬 Novo em loja a partir de <b>${brl(novoMin)}</b> (${ha(prod.novo.pesquisado_em)})</div>` : "";
  const ck = DADOS.checklists[a.categoria] || [];
  const perguntas = ia?.perguntas_vendedor?.length ? `<details><summary>💬 Perguntar ao vendedor${ia.oferta_sugerida ? ` · oferta sugerida <b>${brl(ia.oferta_sugerida)}</b>` : ""}</summary><ul>${ia.perguntas_vendedor.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : "";
  const riscos = ia?.sinais_risco?.length ? `<details><summary>⚠️ Sinais de risco (${ia.sinais_risco.length})</summary><ul>${ia.sinais_risco.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : "";
  const acomp = ia?.acompanha?.length ? `<div class="mini">📦 Acompanha: ${ia.acompanha.map(esc).join(", ")}</div>` : "";
  const checklist = ck.length ? `<details><summary>✅ Checklist na hora (${ck.length})</summary><ul>${ck.map(p => `<li>${esc(p)}</li>`).join("")}</ul></details>` : "";
  const refTxt = !a.ref ? "sem referência ainda" : a.fonte_revenda === "web" ? `revenda ~${brl(a.ref)} (preço típico de usado na web)`
    : a.fonte_revenda === "pagina" ? `revenda ~${brl(a.ref)} (mediana de ${a.n_ref} anúncios parecidos desta busca)`
    : a.fonte_revenda === "busca" ? `revenda ~${brl(a.ref)} (mediana de ${a.n_ref} anúncios desta busca)`
    : `mercado ${brl(a.ref)} · ${a.n_ref} anúncios${a.ref_tipo === "modelo" && a.variante ? " (todas as versões)" : ""}`;
  const refFaixa = prod?.variantes?.[a.variante] && a.ref_tipo === "variante" ? prod.variantes[a.variante] : prod?.ref;
  const vendidoInfo = a.situacao === "vendido" ? `<div class="mini">Sumiu ${a.horas_ate_sumir != null ? `em ~${Math.round(a.horas_ate_sumir)} h após publicado` : ""} (${dataBr(a.vendido_em)})</div>` : "";

  return `<article class="card ${st === "descartado" ? "apagado" : ""} ${exemplo ? "exemplo" : ""}" data-id="${a.id}">
    ${fotoHtml(a, exemplo)}
    <div class="corpo">
      <h3><a ${linkAnuncio}>${esc(a.titulo)}</a></h3>
      <div class="precos"><span class="preco">${brl(a.preco)}</span>
        ${a.preco_inicial && a.preco < a.preco_inicial ? `<span class="riscado">${brl(a.preco_inicial)}</span>` : ""}
        ${a.lucro != null ? `<span class="lucro ${a.lucro < 0 ? "neg" : ""}">${a.lucro >= 0 ? "+" : ""}${brl(a.lucro)} (${pct(a.margem)})</span>` : ""}</div>
      <div class="muted">${refTxt}</div>
      ${faixaPreco(refFaixa, a.preco)}
      <div class="muted">📍 ${esc(a.bairro || "bairro ?")}${(a.zona || a.cidade) && (a.zona || a.cidade) !== a.bairro ? " · " + esc(a.zona || a.cidade) : ""}${(a.publicado_em || a.primeiro_visto) ? " · " + ha(a.publicado_em || a.primeiro_visto) : ""}</div>
      <div class="mini">${ICONE[a.categoria] || ""} ${esc(a.item_nome)}${a.variante ? " · " + esc(a.variante) : ""}${a.motivo ? " · " + esc(a.motivo) : ""}</div>
      ${linhaNovo}${vendidoInfo}
      <div class="badges">${badges.join("")}</div>
      ${ia ? `<div class="resumo-ia">🤖 ${esc(ia.resumo)}</div>` : ""}
      ${acomp}${riscos}${perguntas}${checklist}
      ${exemplo ? `<div class="acoes">
        <button class="btn" data-exemplo-link>📍 Vou ver</button>
        <button class="btn" data-exemplo-link>🛒 Comprei</button>
        <button class="btn" data-exemplo-link aria-label="Descartar">🗑️</button>
        <a class="btn primario" ${linkAnuncio}>Abrir anúncio ↗</a>
      </div>` : a.situacao === "vendido" ? "" : `<div class="acoes">
        <button class="btn ${st === "vou_ver" ? "ativo" : ""}" data-acao="vou_ver" data-id="${a.id}">📍 Vou ver</button>
        <button class="btn ${st === "comprei" ? "ativo" : ""}" data-acao="comprei" data-id="${a.id}">🛒 Comprei</button>
        <button class="btn ${st === "descartado" ? "ativo" : ""}" data-acao="descartado" data-id="${a.id}">🗑️</button>
        <a class="btn primario" href="${urlSegura(a.url)}" target="_blank" rel="noopener">Abrir anúncio ↗</a>
      </div>`}
    </div></article>`;
}

const filtros = estado.filtros ||= {categoria: "", zona: "", risco: "", ordem: "margem", ocultarDescartados: true, texto: ""};
function barraFiltros(lista) {
  const cats = [...new Set(lista.map(a => a.categoria).filter(Boolean))];
  const zonas = [...new Set(lista.map(a => a.zona).filter(Boolean))].sort();
  const opt = (v, rot, sel) => `<option value="${esc(v)}" ${sel === v ? "selected" : ""}>${esc(rot)}</option>`;
  return `<div class="filtros">
    <select data-f="categoria" aria-label="Categoria">${opt("", "Todas as categorias", filtros.categoria)}${cats.map(c => opt(c, (ICONE[c] || "") + " " + (CAT_NOME[c] || c), filtros.categoria)).join("")}</select>
    <select data-f="zona" aria-label="Região">${opt("", "Todas as regiões", filtros.zona)}${zonas.map(z => opt(z, z, filtros.zona)).join("")}</select>
    <select data-f="risco" aria-label="Risco">${opt("", "Qualquer risco", filtros.risco)}${opt("baixo", "Só risco baixo", filtros.risco)}${opt("nao_alto", "Sem risco alto", filtros.risco)}</select>
    <select data-f="ordem" aria-label="Ordenar">${opt("margem", "Maior margem", filtros.ordem)}${opt("lucro", "Maior lucro (R$)", filtros.ordem)}${opt("recente", "Mais recentes", filtros.ordem)}${opt("preco", "Menor preço", filtros.ordem)}</select>
    <input data-f="texto" placeholder="Buscar…" value="${esc(filtros.texto)}" aria-label="Buscar">
    ${filtros.item ? `<button class="btn ativo" data-limpar-item>${esc(produtoPorId[filtros.item]?.nome || filtros.item)} ✕</button>` : ""}
    <label class="muted"><input type="checkbox" data-f="ocultarDescartados" ${filtros.ocultarDescartados ? "checked" : ""}> ocultar descartados</label>
  </div>`;
}
function aplicarFiltros(lista) {
  const t = filtros.texto.trim().toLowerCase();
  let r = lista.filter(a =>
    (!filtros.categoria || a.categoria === filtros.categoria) &&
    (!filtros.item || a.item_id === filtros.item) &&
    (!filtros.zona || a.zona === filtros.zona) &&
    (!filtros.risco || (filtros.risco === "baixo" ? a.analise?.nivel_risco === "baixo" : a.analise?.nivel_risco !== "alto")) &&
    (!filtros.ocultarDescartados || estado.status[a.id]?.estado !== "descartado") &&
    (!t || (a.titulo + " " + a.item_nome + " " + (a.bairro || "")).toLowerCase().includes(t)));
  const chave = {margem: a => -(a.margem ?? -999), lucro: a => -(a.lucro ?? -1e9), preco: a => a.preco, recente: a => -new Date(a.publicado_em || a.primeiro_visto)}[filtros.ordem];
  return r.sort((x, y) => chave(x) - chave(y));
}

const AO = DADOS.analise_olx || {catalogo: [], exclusoes: {}, bairros: {}, revenda: {}, municipios: [], zonas: []};
const normalizar = t => String(t || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
function precoNum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return v > 0 ? v : null;
  let t = String(v).replace(/[^\d,.]/g, "");
  if (!t) return null;
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, "");
  const n = parseFloat(t); return n > 0 ? n : null;
}
const CAT_RE = AO.catalogo.map(i => ({...i, re: new RegExp(i.padrao), ex: i.excluir ? new RegExp(i.excluir) : null}));
const EXC_ACESS = (AO.exclusoes.acessorios || []).map(p => new RegExp(p, "g"));
const EXC_NEG = (AO.exclusoes.negocio || []).map(p => new RegExp(p, "g"));
const NEGACAO = (AO.exclusoes.negacoes || []).length
  ? new RegExp(`\\b(${[...AO.exclusoes.negacoes].sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})\\s+(\\w+\\s+){0,2}$`) : null;
const RE_ARMAZ = /\b(32|64|128|256|512)\s*(gb|g|giga|gigas)\b|\b(1|2)\s*(tb|tera)\b/;

function classificarOlx(titulo, preco) {
  const t = normalizar(titulo);
  let item = null, m = null;
  for (const i of CAT_RE) { const r = i.re.exec(t); if (r && !(i.ex && i.ex.test(t))) { item = i; m = r; break; } }
  if (!item) return {item: null, motivo: "não é um produto do catálogo"};
  const a = RE_ARMAZ.exec(t);
  const variante = item.variante === "armazenamento" && a ? (a[1] ? a[1] + "GB" : a[3] + "TB") : null;
  for (const re of EXC_NEG) {
    re.lastIndex = 0; let r;
    while ((r = re.exec(t))) {
      if (!(NEGACAO && NEGACAO.test(t.slice(Math.max(0, r.index - 30), r.index)))) return {item, variante, motivo: `termo excluído: "${r[0]}"`};
      if (r[0] === "") re.lastIndex++;
    }
  }
  for (const re of EXC_ACESS) { re.lastIndex = 0; const r = re.exec(t); if (r && r.index < m.index) return {item, variante, motivo: `parece acessório/peça: "${r[0]}"`}; }
  if (preco == null) return {item, variante, motivo: "sem preço"};
  if (preco < item.preco_min) return {item, variante, motivo: `preço abaixo do plausível (R$ ${item.preco_min})`};
  return {item, variante, motivo: null};
}
function zonaOlx(cidade, bairro) {

function contaLoteJs(l, cfg) {
  const moto = l.veiculo === "moto";
  const comissaoPct = l.comissao_pct != null && l.comissao_pct !== "" ? Number(l.comissao_pct) : cfg.comissao_leiloeiro_pct;
  const c = comissaoPct / 100;
  const lance = Number(l.lance_atual) || 0, comissao = lance * c;
  const custos = moto ? (cfg.custos_fixos_moto_reais ?? 1200) : cfg.custos_fixos_reais;
  const reparo = Number(l.reparo_estimado) || 0, debitos = Number(l.debitos) || 0, taxas = Number(l.taxas_leiloeiro) || 0;
  const total = lance + comissao + custos + reparo + debitos + taxas;
  const desagio = (cfg.desagio_revenda_pct || {})[l.tipo] ?? (cfg.desagio_revenda_pct || {}).outro ?? 20;
  const revenda = l.valor_fipe ? l.valor_fipe * (1 - desagio / 100) : null;
  const lucro = revenda != null ? revenda - total : null;
  const margem = lucro != null && total ? lucro / total * 100 : null;
  const dias = Number(l.dias_venda) || (cfg.dias_para_vender || {})[moto ? "moto" : "carro"] || 30;
  const roiMes = margem != null ? margem * 30 / Math.max(dias, 1) : null;
  const fixos = custos + reparo + debitos + taxas;
  const arred = v => v == null ? null : Math.max(0, Math.round(v / 100) * 100);
  const equilibrio = revenda != null ? arred((revenda - fixos) / (1 + c)) : null;
  const lmax = revenda != null ? arred((revenda / (1 + cfg.margem_min_pct / 100) - fixos) / (1 + c)) : null;
  const pess = cfg.pessimista || {revenda_menor_pct: 10, reparo_maior_pct: 50};
  const lucroPess = revenda != null ? revenda * (1 - pess.revenda_menor_pct / 100) - (lance + comissao + custos + reparo * (1 + pess.reparo_maior_pct / 100) + debitos + taxas) : null;
  return {lance, comissao, comissao_pct: comissaoPct, custos, reparo, debitos, taxas, total, fipe: l.valor_fipe, desagio_pct: desagio, revenda, lucro, margem,
    dias, roi_mes: roiMes, equilibrio, lance_maximo_lucrativo: lmax, lucro_pessimista: lucroPess, moto};
}

// Consulta feita pelo SEU navegador (sem chave). Fonte: Tabela FIPE oficial, repassada pela API parallelum.com.br.
const FIPE_API = "https://parallelum.com.br/fipe/api/v1";
const fipeCache = {};
async function fipeGet(caminho) {
  if (fipeCache[caminho]) return fipeCache[caminho];
  const r = await fetch(FIPE_API + caminho);
  if (r.status === 429) throw new Error("limite de consultas da API FIPE atingido; tente em alguns minutos");
  if (!r.ok) throw new Error("API FIPE respondeu HTTP " + r.status);
  return (fipeCache[caminho] = await r.json());
}
const ALIAS_MARCA = {chevrolet: "gm", chevy: "gm", gm: "gm", volkswagen: "vw", volks: "vw", vw: "vw", mercedes: "mercedes", benz: "mercedes",
  "land": "land", rover: "land", citroen: "citroen", peugeot: "peugeot", caoa: "caoa", chery: "chery", harley: "harley", royal: "royal"};
const tokensFipe = t => normalizar(t).replace(/\b(19|20)\d{2}(\/(19|20)\d{2})?\b/g, " ").replace(/[^a-z0-9.]/g, " ").split(/\s+/).filter(w => w.length >= 1 && !["flex", "mec", "aut", "p", "v", "c", "de", "da", "do"].includes(w));
function acharMarca(marcas, texto) {
  const tk = tokensFipe(texto);
  let melhor = null, pts = 0;
  for (const m of marcas) {
    const nome = normalizar(m.nome).replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
    let p = 0;
    for (const w of tk) { const a = ALIAS_MARCA[w] || w; if (nome.includes(a) || nome.includes(w)) p += 2; }
    if (p > pts) { pts = p; melhor = m; }
  }
  return melhor;
}
function rankModelos(modelos, texto, marcaNome) {
  const marca = new Set(normalizar(marcaNome).replace(/[^a-z0-9 ]/g, " ").split(/\s+/));
  const tk = tokensFipe(texto).filter(w => !marca.has(ALIAS_MARCA[w] || w) && !marca.has(w));
  return modelos.map(m => {
    const nm = tokensFipe(m.nome);
    let p = 0;
    tk.forEach((w, i) => { if (nm.includes(w)) p += (i === 0 ? 3 : /\d/.test(w) ? 2 : 1); });
    return {...m, p: p - nm.length * 0.05};
  }).filter(m => m.p > 0).sort((a, b) => b.p - a.p);
}
function escolherAno(anos, ano) {
  if (!anos.length) return null;
  const doAno = anos.filter(a => String(a.codigo).startsWith(String(ano)) || String(a.nome).startsWith(String(ano)));
  if (doAno.length) return doAno.find(a => /-1$/.test(a.codigo) || /gasolina|flex/i.test(a.nome)) || doAno[0];
  // ano não existe para a versão: pega o mais próximo
  const n = a => parseInt(a.codigo, 10) > 3000 ? 9999 : parseInt(a.codigo, 10);
  return [...anos].sort((a, b) => Math.abs(n(a) - ano) - Math.abs(n(b) - ano))[0];

async function valorFipe(tipo, marca, modelo, ano) {
  const anos = await fipeGet(`/${tipo}/marcas/${marca.codigo}/modelos/${modelo.codigo}/anos`);
  const a = escolherAno(anos, ano);

async function buscarFipe() {

  if (!form || !out) return;
  const l = lerCalc(form);
  if (!l.marca_modelo) { out.innerHTML = `<span class="muted">Preencha o modelo (com a marca) para buscar a FIPE.</span>`; return; }
  if (!l.ano) { out.innerHTML = `<span class="muted">Preencha o ano para buscar a FIPE.</span>`; return; }
  const tipo = l.veiculo === "moto" ? "motos" : "carros";
  out.innerHTML = `<span class="muted">🔎 Buscando na Tabela FIPE…</span>`;
  try {
    const marcas = await fipeGet(`/${tipo}/marcas`);
    const marca = acharMarca(marcas, l.marca_modelo);
    if (!marca) { out.innerHTML = `⚠️ Não reconheci a marca em “${esc(l.marca_modelo)}”. Escreva a marca no modelo (ex.: “Chevrolet Onix 1.0 LT”) ou <a href="https://veiculos.fipe.org.br/" target="_blank" rel="noopener">consulte a FIPE</a>.`; return; }
    const lista = (await fipeGet(`/${tipo}/marcas/${marca.codigo}/modelos`)).modelos || [];
    const rank = rankModelos(lista, l.marca_modelo, marca.nome).slice(0, 8);
    if (!rank.length) { out.innerHTML = `⚠️ Não achei a versão de “${esc(l.marca_modelo)}” na FIPE (${esc(marca.nome)}). <a href="https://veiculos.fipe.org.br/" target="_blank" rel="noopener">Consulte a FIPE</a> e digite o valor.`; return; }
    window._fipeOpcoes = {tipo, marca, rank, ano: l.ano};
    await aplicarVersaoFipe(0);
  } catch (e) {
    out.innerHTML = `⚠️ Não consegui consultar a FIPE agora (${esc(e.message)}). <a href="https://veiculos.fipe.org.br/" target="_blank" rel="noopener">Consulte a FIPE</a> e digite o valor.`;

}

async function aplicarVersaoFipe(i) {

function cardRota(r, exemplo = false) {
  const u = r.ultima;
  const voos = (u?.voos || []).slice().sort((a, b) => a.preco - b.preco);
  const melhor = voos[0];
  const bom = melhor && r.preco_alvo && melhor.preco <= r.preco_alvo;
  const minHist = r.historico.length ? Math.min(...r.historico.map(h => h.preco)) : null;
  const link = v => exemplo ? `<a href="#" data-exemplo-link>` : `<a href="${urlSegura(v.url)}" target="_blank" rel="noopener">`;
  return `<article class="card ${exemplo ? "exemplo" : ""}">
    <div class="corpo">
      ${exemplo ? `<div>${SELO_EXEMPLO}</div>` : ""}
      <h3>✈️ ${esc(r.nome)} ${r.ativa === false ? `<span class="pill">pausada</span>` : ""}</h3>
      <div class="muted">${esc((r.destinos || []).join(" · "))}<br>${esc(r.periodo)} · ${r.min_dias || "?"}–${r.max_dias || "?"} dias · alvo ${brl(r.preco_alvo)}</div>
      ${melhor ? `<div class="precos"><span class="preco">${brl(melhor.preco)}</span>
          <span class="pill"><span class="dot" style="background:${bom ? "var(--good)" : "var(--warning)"}"></span>${bom ? "✓ abaixo do alvo" : "acima do alvo"}</span>
          ${minHist && melhor.preco <= minHist ? `<span class="pill">📉 menor já visto</span>` : ""}</div>
          <div class="mini">ida e volta por adulto · pesquisado ${ha(u.pesquisado_em)}</div>`
        : `<div class="muted">${r.erro ? "Última pesquisa falhou: " + esc(r.erro) : "Aguardando a primeira pesquisa."}</div>`}
      ${sparkline(r.historico, r.preco_alvo)}
      ${voos.length ? `<div class="ofertas">${voos.slice(0, 5).map(v => `${link(v)}<span>${esc(v.destino)} · ${esc(diaMes(v.ida))}${v.volta ? " → " + esc(diaMes(v.volta)) : ""}<br><span class="mini">${esc(v.companhia)} · ${esc(v.escalas)} · ${esc(v.fonte)}</span></span><b>${brl(v.preco)}</b></a>`).join("")}</div>` : ""}
      ${u?.resumo ? `<div class="resumo-ia">🤖 ${esc(u.resumo)}</div>` : ""}
    </div></article>`;
}

function renderOperacoes() {
  const linhas = ops().map(([id, v]) => ({id, ...v, lucro: v.preco_venda != null ? v.preco_venda - v.preco_compra : null,
    dias: v.data_venda ? Math.max(0, Math.round((new Date(v.data_venda) - new Date(v.data_compra)) / 86400000)) : null}));
  const vendidas = linhas.filter(l => l.lucro != null);
  const total = vendidas.reduce((s, l) => s + l.lucro, 0);
  const investido = linhas.filter(l => l.lucro == null).reduce((s, l) => s + l.preco_compra, 0);
  const porCat = {};
  for (const l of vendidas) { const c = porCat[l.categoria || "outros"] ||= {n: 0, lucro: 0, dias: 0}; c.n++; c.lucro += l.lucro; c.dias += l.dias || 0; }
  let html = `<p class="muted">Registro das suas compras e vendas. Fica salvo <b>só neste navegador</b>: use Exportar/Importar para levar a outro aparelho.</p>
    <div class="tiles"><div class="tile"><div class="rot">Lucro realizado</div><div class="val">${brl(total)}</div></div>
    <div class="tile"><div class="rot">Operações concluídas</div><div class="val">${vendidas.length}</div></div>
    <div class="tile"><div class="rot">Em estoque (investido)</div><div class="val">${brl(investido)}</div></div></div>
    <div class="filtros" style="margin-top:12px"><button class="btn" id="exportar">⬇️ Exportar</button><label class="btn">⬆️ Importar<input type="file" id="importar" accept="application/json" hidden></label></div>`;
  if (!linhas.length) return html + `<div class="vazio">Quando você marcar 🛒 Comprei num card, a operação aparece aqui.</div>`;
  html += `<h2>Ranking por categoria</h2><table><thead><tr><th>Categoria</th><th class="num">Vendas</th><th class="num">Lucro total</th><th class="num">Lucro médio</th><th class="num">Dias até vender</th></tr></thead><tbody>` +
    Object.entries(porCat).sort((a, b) => b[1].lucro - a[1].lucro).map(([c, v]) => `<tr><td>${ICONE[c] || ""} ${esc(CAT_NOME[c] || c)}</td><td class="num">${v.n}</td><td class="num">${brl(v.lucro)}</td><td class="num">${brl(v.lucro / v.n)}</td><td class="num">${(v.dias / v.n).toFixed(1)}</td></tr>`).join("") +
    `</tbody></table><h2>Operações</h2><table><thead><tr><th>Produto</th><th class="num">Compra</th><th class="num">Venda</th><th class="num">Lucro</th><th class="num">Dias</th><th></th></tr></thead><tbody>` +
    linhas.sort((a, b) => new Date(b.data_compra) - new Date(a.data_compra)).map(l => `<tr><td>${esc(l.titulo)}<div class="mini">comprado em ${dataBr(l.data_compra)}</div></td>
      <td class="num">${brl(l.preco_compra)}</td><td class="num">${l.preco_venda != null ? brl(l.preco_venda) : "—"}</td>
      <td class="num">${l.lucro != null ? brl(l.lucro) : "—"}</td><td class="num">${l.dias ?? "—"}</td>
      <td>${l.lucro == null ? `<button class="btn" data-acao="vendi" data-id="${l.id}">💰 Vendi</button>` : ""} <button class="btn" data-acao="remover" data-id="${l.id}" aria-label="Remover operação">✕</button></td></tr>`).join("") + `</tbody></table>`;
  return html;
}

function renderTopo() {
  const ger = new Date(DADOS.gerado_em);
  document.getElementById("atualizado").textContent = `Atualizado ${ha(DADOS.gerado_em)} (${dataBr(DADOS.gerado_em)})`;
  const avisos = [];
  if ((Date.now() - ger) / 3600000 > 8) avisos.push("⏳ O painel não é atualizado há mais de 8 horas. Confira a aba Actions do repositório.");
  const ult = DADOS.execucoes[0];
  if (DADOS.olx_ativa && ult && ult.erros.some(e => /bloque|403|anti-robô/i.test(e))) avisos.push(ult.coletados === 0
    ? "🚧 A OLX bloqueou o robô na última execução (nenhum anúncio coletado). Promoções, preço novo e passagens continuam funcionando."
    : "🚧 A OLX bloqueou parte das buscas na última execução. Os dados podem estar incompletos.");
  if (!DADOS.execucoes.length) avisos.push("🚀 Ainda não houve nenhuma execução. Rode o workflow manualmente em Actions.");
  document.getElementById("avisos").innerHTML = avisos.map(a => `<div class="aviso">${a}</div>`).join("");
  const opp = DADOS.anuncios.filter(a => a.situacao === "oportunidade");
  const novas = visitaAnterior ? opp.filter(a => new Date(a.virou_oportunidade_em || a.primeiro_visto) > visitaAnterior).length : opp.length;
  const lucroPot = opp.reduce((s, a) => s + Math.max(0, a.lucro || 0), 0);
  const realizado = ops().reduce((s, [, v]) => s + (v.preco_venda != null ? v.preco_venda - v.preco_compra : 0), 0);
  const tile = (r, v) => `<div class="tile"><div class="rot">${r}</div><div class="val">${v}</div></div>`;
  document.getElementById("tiles").innerHTML =
    tile("🔔 Oportunidades agora", opp.length) + tile("🆕 Novas desde sua última visita", novas) +
    tile("💵 Lucro potencial somado", brl(lucroPot)) + tile("👀 Em observação", DADOS.anuncios.filter(a => a.situacao === "observacao").length) +
    tile("💰 Lucro realizado", brl(realizado));
}

// ---------------------------------------------------------------- eventos
document.addEventListener("click", e => {
  const aba = e.target.closest("[data-aba]");
  if (aba) { abaAtual = aba.dataset.aba; history.replaceState(null, "", "#" + abaAtual); render(); return; }
  const vp = e.target.closest("[data-ver-produto]");
  if (vp) {
    const p = produtoPorId[vp.dataset.verProduto];
    Object.assign(filtros, {categoria: "", texto: "", item: p.id}); salvar();
    abaAtual = DADOS.anuncios.some(a => a.item_id === p.id && a.situacao === "oportunidade") ? "oportunidades" : "observacao";
    render(); return;
  }
  const alt = e.target.closest("[data-alternar-exemplo]");
  if (alt) {
    const aba = alt.dataset.alternarExemplo;
    const tem = {produtos: DADOS.produtos.some(p => p.ref || p.novo), passagens: DADOS.passagens.some(r => r.ultima),
                 oportunidades: DADOS.anuncios.some(a => a.situacao === "oportunidade"),
                 promocoes: (DADOS.promocoes?.achados || []).length > 0,
                 leiloes: (DADOS.leiloes?.lotes || []).length > 0}[aba];
    const atual = mostrarExemplo(aba, tem);
    estado.exemplos[aba] = !atual; salvar(); render(); return;
  }
  if (e.target.closest("[data-exemplo-link]")) { e.preventDefault(); alert("Este é um card de exemplo: os links aparecem nos cards reais."); return; }
  if (e.target.closest("[data-descartar-lido]")) { delete estado.loteLido; salvar(); render(); return; }
  const rl = e.target.closest("[data-remover-lote]");
  if (rl) { estado.lotesManuais = (estado.lotesManuais || []).filter(l => l.id !== rl.dataset.removerLote); salvar(); render(); return; }
  if (e.target.closest("[data-limpar-olx]")) { if (confirm("Apagar os anúncios trazidos da OLX?")) { delete estado.importOlx; IMPORTADOS = []; salvar(); render(); } return; }
  if (e.target.closest("[data-limpar-item]")) { filtros.item = ""; salvar(); render(); return; }
  const f = e.target.closest("[data-foto]");
  if (f) {
    const a = [...DADOS.anuncios, ...DADOS.vendidos, ...IMPORTADOS].find(x => x.id === f.dataset.id);
    const box = f.closest(".foto");
    const idx = (Number(box.dataset.idx) + Number(f.dataset.foto) + a.imagens.length) % a.imagens.length;
    box.dataset.idx = idx; box.querySelector("img").src = a.imagens[idx]; return;
  }
  const b = e.target.closest("[data-acao]");
  if (!b) return;
  const id = b.dataset.id, acao = b.dataset.acao;
  const a = DADOS.anuncios.find(x => x.id === id) || (DADOS.promocoes?.achados || []).find(x => x.id === id) || IMPORTADOS.find(x => x.id === id);
  const atual = estado.status[id] || {};
  if (acao === "remover") { if (confirm("Remover esta operação?")) delete estado.status[id]; }
  else if (acao === "comprei") {
    const v = prompt("Quanto você pagou? (R$)", a ? Math.round(a.preco) : "");
    if (v === null) return;
    estado.status[id] = {...atual, estado: "comprei", preco_compra: Number(String(v).replace(/\D/g, "")), data_compra: new Date().toISOString(),
      titulo: a?.titulo || atual.titulo, categoria: a?.categoria || atual.categoria, item_id: a?.item_id || atual.item_id};
  } else if (acao === "vendi") {
    const v = prompt("Por quanto você vendeu? (R$)");
    if (v === null) return;
    estado.status[id] = {...atual, estado: "vendi", preco_venda: Number(String(v).replace(/\D/g, "")), data_venda: new Date().toISOString()};
  } else {
    if (atual.estado === acao) delete estado.status[id];
    else estado.status[id] = {...atual, estado: acao, titulo: a?.titulo, categoria: a?.categoria};
  }
  salvar(); renderTopo(); render();
});
document.addEventListener("change", e => {
  const f = e.target.dataset.f;
  if (f) { filtros[f] = e.target.type === "checkbox" ? e.target.checked : e.target.value; salvar(); render(); }
  if (e.target.id === "importar" && e.target.files[0]) {
    e.target.files[0].text().then(t => {
      try { const dados = JSON.parse(t); Object.assign(estado.status, dados.status || {}); salvar(); renderTopo(); render(); alert("Importado!"); }
      catch { alert("Arquivo inválido."); }
    });
  }
});
document.addEventListener("input", e => {
  if (e.target.dataset.f === "texto") {
    filtros.texto = e.target.value; salvar();
    clearTimeout(window._t); window._t = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = document.querySelector('[data-f="texto"]'); i.focus(); i.setSelectionRange(pos, pos); }, 250);
  }
});
document.addEventListener("click", e => {
  if (e.target.id !== "exportar") return;
  const blob = new Blob([JSON.stringify({status: estado.status}, null, 1)], {type: "application/json"});
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(blob), download: `revenda-operacoes-${new Date().toISOString().slice(0, 10)}.json`});
  a.click();
});

renderTopo();
render();
</script>
</body>
